function axisState(run, ax) {
  const a = run.counts[ax[0]], b = run.counts[ax[1]];

// Scenes whose axis is already decided are skipped, but every chapter keeps at least 2 scenes.
function chapterQueue(run, ch) {
  const sc = ch.scenes;
  const keep = sc.filter(s => !axisState(run, s.axis).done);
  if (keep.length < 2) {
    const extra = sc.filter(s => !keep.includes(s)).sort((x, y) => (y.core ? 1 : 0) - (x.core ? 1 : 0));
    while (keep.length < 2 && extra.length) keep.push(extra.shift());
  }
  return sc.filter(s => keep.includes(s));
}
