<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0a0716;color:var(--ink);font-family:'Pixelify Sans',ui-monospace,Menlo,Consolas,monospace}
#app{max-width:420px;height:100vh;height:100dvh;max-height:920px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
#hud{height:38px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px;font-size:15px;color:var(--dim);background:#0d0920;border-bottom:3px solid var(--line)}
#chip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px}
#stab{display:flex;align-items:center;gap:6px;font-size:14px}
#stab i{display:block;width:54px;height:8px;background:#2a2060;border:2px solid var(--line)}
#stab u{display:block;height:100%;width:100%;background:var(--cyan);transition:width .6s,background .6s;text-decoration:none}
#mute{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:2px solid var(--line);padding:2px 6px;cursor:pointer}
#stage{position:relative;flex:none;background:#000;line-height:0}
#cv{width:100%;aspect-ratio:4/3;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#timer{position:absolute;left:0;bottom:0;height:7px;width:100%;background:var(--pink);display:none}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s;background:#fff}
#panel{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 16px;-webkit-overflow-scrolling:touch}
.cap{font-size:20px;line-height:1.35;margin:0 0 12px;min-height:3.2em;cursor:pointer}
.title{font-family:'Press Start 2P',monospace;font-size:19px;line-height:1.35;color:var(--accent);text-shadow:3px 3px 0 #7a2bff;margin:0 0 4px}
.sub{font-family:'Press Start 2P',monospace;font-size:10px;color:var(--cyan);margin:0 0 12px;letter-spacing:1px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:18px;line-height:1.25;color:var(--ink);background:var(--panel);border:3px solid var(--line);border-radius:6px;padding:10px 12px;margin:0 0 8px;box-shadow:0 4px 0 #0a0716;opacity:0;animation:pop .28s ease-out forwards;cursor:pointer}
.opt::before{content:"\25B6  ";color:var(--pink);font-size:10px}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #0a0716}
.opt.chosen{background:var(--accent);color:#2a1a00;border-color:#fff7e0}
.opt.chosen::before{color:#2a1a00}
.opt.off{opacity:.35!important;pointer-events:none}
.opt.ghost{background:transparent;border-style:dashed;color:var(--dim)}
.opt.bad{animation:shake .3s}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.note{background:#2a2060;border:2px dashed #6b5bd6;border-radius:6px;padding:8px 10px;margin:0 0 12px;font-size:17px;line-height:1.35;color:#d9d0ff}

.blurb{font-size:18px;line-height:1.4;margin:0 0 12px}

.spec .r{text-align:right}
.spec .tr{height:10px;background:var(--pink);border:2px solid var(--line);position:relative}
.spec .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--cyan)}
.card{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:8px 10px;margin:0 0 8px;font-size:17px;line-height:1.35}

.ticket h3{font-family:'Press Start 2P',monospace;font-weight:400;font-size:12px;margin:0 0 8px}
.ticket .fine{font-size:15px;opacity:.75;margin-top:8px}

.ans.bad{animation:shake .3s;border-color:var(--pink)}

@media (prefers-reduced-motion:reduce){.opt{animation:none;opacity:1}#flash,#stab u{transition:none}}

//#LOGIC-START
const AXES = ['EI', 'SN', 'TF', 'JP'];

function newRun() { const counts = {}; POLES.forEach(p => counts[p] = 0); return { counts, history: [] }; }
function axisState(run, ax) {
  const a = run.counts[ax[0]], b = run.counts[ax[1]];
  return { a, b, n: a + b, done: Math.max(a, b) >= WIN, lead: a > b ? ax[0] : b > a ? ax[1] : null };
}
// Scenes whose axis is already decided are skipped, but every chapter keeps at least 2 scenes.
function chapterQueue(run, ch) {
  const sc = ch.scenes;
  const keep = sc.filter(s => !axisState(run, s.axis).done);
  if (keep.length < 2) {
    const extra = sc.filter(s => !keep.includes(s)).sort((x, y) => (y.core ? 1 : 0) - (x.core ? 1 : 0));
    while (keep.length < 2 && extra.length) keep.push(extra.shift());
  }
  return sc.filter(s => keep.includes(s));
}
function record(run, scene, opt) { run.counts[opt.p]++; run.history.push({ id: scene.id, p: opt.p }); }
function resultType(run) { return AXES.map(ax => axisState(run, ax).lead || ax[0]).join(''); }
function leaders(run) { return AXES.map(ax => axisState(run, ax).lead).filter(Boolean); }
function spectrum(run) {
  return AXES.map(ax => {
    const s = axisState(run, ax);
    const pa = s.n ? Math.round(100 * s.a / s.n) : 50;
    return { ax, a: ax[0], b: ax[1], pa, pb: 100 - pa, lead: s.lead || ax[0], n: s.n };
  });
}
function pairLine(x, y) {
  const same = [0, 1, 2, 3].filter(i => x[i] === y[i]).length;
  return ["Total opposites. The Glitch never saw this duo coming.",
    "Opposites attract: different strengths, one very good team.",
    "A balanced flock: you each cover the other's blind spots.",
    "Nearly synced. One tiny difference keeps it interesting.",

function temperament(type) {
  if (type[1] === 'N') return type[2] === 'T' ? 'NT' : 'NF';
  return type[3] === 'J' ? 'SJ' : 'SP';
}
const TINT = { NT: '#c9a7ff', NF: '#8fe3b0', SJ: '#8ecbff', SP: '#ffb27a' };
//#LOGIC-END

/* ============================================================

const rnd = n => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function tri(cx, top, h, c, k = 1.2) { for (let i = 0; i < h; i++) { const w = Math.max(1, Math.round((i + 1) * k)); R(cx - Math.floor(w / 2), top + i, w, 1, c); } }

const A = {
  ctx: null, m: false, tense: false,
  init() {
    if (this.ctx) { this.wake(); return; }
    try {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      this.ctx = new C(); this.out = this.ctx.createGain(); this.out.gain.value = .5; this.out.connect(this.ctx.destination); this.loop();
    } catch (e) { }
  },
  wake() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  t(f, d, type, v, delay, to) {
    if (!this.ctx || this.m) return;
    const c = this.ctx, os = c.createOscillator(), gn = c.createGain(), t0 = c.currentTime + (delay || 0);
    os.type = type || 'square'; os.frequency.setValueAtTime(f, t0); if (to) os.frequency.exponentialRampToValueAtTime(to, t0 + d);
    gn.gain.setValueAtTime(v || .1, t0); gn.gain.exponentialRampToValueAtTime(.001, t0 + d);
    os.connect(gn); gn.connect(this.out); os.start(t0); os.stop(t0 + d + .02);
  },
  blip() { this.wake(); this.t(660, .07, 'square', .08, 0, 880); },
  tick() { this.t(1100, .02, 'square', .02); },
  pick() { this.t(523, .08, 'square', .1); this.t(784, .12, 'square', .1, .08); },
  err() { this.t(180, .2, 'sawtooth', .1, 0, 90); },
  heart() { this.t(60, .12, 'sine', .3); this.t(55, .12, 'sine', .25, .16); },
  hatch() { [523, 659, 784, 1047, 1319].forEach((f, i) => this.t(f, .14, 'square', .09, i * .08)); },
  win() { [659, 784, 988, 1319].forEach((f, i) => this.t(f, .16, 'triangle', .12, i * .1)); },
  loop() {
    const bass = [110, 110, 130.8, 98, 110, 110, 146.8, 130.8]; let i = 0;
    const step = () => {
      if (!document.hidden) { const n = bass[i % 8]; this.t(n, .22, 'triangle', .07); if (i % 2) this.t(n * 4, .05, 'square', .018); i++; }

/* ---------- boot ---------- */
$('#mute').addEventListener('click', () => { A.init(); A.setMuted(!A.m); });
try { if (localStorage.getItem('dq-mute') === '1') A.setMuted(true); } catch (e) { }
document.addEventListener('pointerdown', () => A.init(), { once: true });
requestAnimationFrame(frame);
startGame();
</script>
